<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>Step Up Business Solutions — Tarjeta Digital Express</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ============================================================
       CONTENEDOR PRINCIPAL — 1080 x 1920 px
       ============================================================ -->
  <div class="digital-card">

    <!-- CAPA 1: Imagen de fondo (posicionada absolutamente) -->
    <img
      class="card-background"
      src="assets/img/background2.jpg"
      alt="Fondo"
    />

    <!-- CAPA 2: Overlay oscuro para contraste de textos -->
    <div class="card-overlay"></div>

    <!-- CAPA 3: Contenido principal -->
    <div class="card-content">

    <!-- ── SECCIÓN SUPERIOR ── -->
    <header class="card-header">

	<!-- Línea decorativa superior -->
	<div class="deco-line top-line"></div>

	<!-- Nombre del negocio -->
	<h1 class="business-name">Step Up Business Solutions</h1>

	<!-- Frase breve o tipo de negocio -->
	<p class="slogan">Presencia digital clara y funcional</p>

	<!-- Línea decorativa separadora -->
	<div class="deco-divider"></div>

	</header>
      
     <!-- ── SECCIÓN QR: ACCIÓN PRINCIPAL ── -->
	<section class="card-qr">

	<!-- CTA principal: indica qué debe hacer la persona -->
	<p class="qr-cta">CONTÁCTANOS</p>

	<!-- Marco central del QR -->
	<div class="qr-frame">
    <div class="qr-corner tl"></div>
    <div class="qr-corner tr"></div>
    <div class="qr-corner bl"></div>
    <div class="qr-corner br"></div>

    <img
      class="qr-img"
      src="assets/img/qr-placeholder.png"
      alt="Código QR Step Up Business Solutions"
    />
	</div>

	<!-- Destino del QR: explica a dónde lleva -->
	<p class="qr-description">Consultas por WhatsApp</p>

	</section>
	<!-- Línea decorativa inferior -->
<div class="deco-line qr-bottom-line"></div>

      <!-- ── SECCIÓN INFERIOR: DATOS DE CONTACTO ── -->
      <footer class="card-footer">

      <!-- Frase final -->
        <p class="frase-final">Diseño por Step Up Business Solutions</p>

      </footer>

    </div>
    <!-- /card-content -->

  </div>
  <!-- /digital-card -->

  <script src="script.js"></script>
</body>
</html>
